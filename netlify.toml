[build]
  publish = "web"
  functions = "netlify/functions"
  # Solo publica si cambia la app (no por los datos que GitHub actualiza solo).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- web netlify netlify.toml ':(exclude)web/data'"

[[redirects]]
  from = "/api/fuente"
  to = "/.netlify/functions/fuente"
  status = 200

[[redirects]]
  from = "/api/sc"
  to = "/.netlify/functions/sc"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
