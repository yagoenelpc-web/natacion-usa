name: Volcar páginas

on:
  workflow_dispatch:
    inputs:
      urls:
        description: URLs separadas por espacios
        required: true
      max:
        description: Caracteres por página
        default: "2500"
      grep:
        description: Mostrar solo alrededor de este texto
        default: ""

jobs:
  volcar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: scripts/datos-rama.sh bajar
        if: ${{ inputs.grep == 'DIRECTO' }}
      - run: node scripts/revisar_directo.mjs
        if: ${{ inputs.grep == 'DIRECTO' }}
        env:
          URLS: ${{ inputs.urls != '-' && inputs.urls || '' }}
      - run: node scripts/volcar.mjs
        if: ${{ inputs.grep != 'DIRECTO' }}
        env:
          URLS: ${{ inputs.urls }}
          MAX: ${{ inputs.max }}
          GREP: ${{ inputs.grep }}
