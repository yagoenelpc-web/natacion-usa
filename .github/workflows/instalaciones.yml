name: Instalaciones

on:
  schedule:
    - cron: "15 4 * * 1"
  workflow_dispatch:
    inputs:
      solo:
        description: "Probar solo con estas universidades (separadas por comas), sin guardar"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ${{ inputs.solo && 'instalaciones-prueba' || 'datos-app' }}
  cancel-in-progress: false

jobs:
  instalaciones:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: scripts/datos-rama.sh bajar
      - run: node scripts/build_instalaciones.mjs
        env:
          SOLO: ${{ inputs.solo }}
      - name: Guardar
        if: ${{ !inputs.solo }}
        run: scripts/datos-rama.sh subir
