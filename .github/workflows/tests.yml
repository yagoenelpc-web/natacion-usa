name: Pruebas

on:
  push:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Pruebas sin red
        run: pytest -q
      - name: Pruebas contra la web real de resultados
        env:
          NATACION_LIVE: "1"
        run: pytest -q -s tests/test_live.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pruebas de la app web
        run: npm test
      - name: App web contra las webs reales
        env:
          NATACION_LIVE: "1"
        run: node --test --test-reporter=spec tests/js/live.test.js
      - name: Capturas de la app en tamaño móvil
        env:
          CAPTURAS_LOG: "1"
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          (node scripts/dev.mjs > dev.log 2>&1 &)
          sleep 2
          node scripts/capturas.mjs capturas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: capturas/
