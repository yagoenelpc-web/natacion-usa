name: Pruebas

on:
  push:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Pruebas sin red
        run: pytest -q
      - name: Pruebas contra la web real de resultados
        env:
          NATACION_LIVE: "1"
        run: pytest -q -s tests/test_live.py
