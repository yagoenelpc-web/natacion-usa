name: Resultados de encuentros

on:
  schedule:
    - cron: "41 7 * * *"
    - cron: "41 19 * * *"
  workflow_dispatch:
    inputs:
      minutos:
        description: Minutos máximos de lectura
        default: "40"
      guardar:
        description: Guardar en la rama de datos (no = solo prueba)
        default: "si"
      debug:
        description: Mostrar muestras del texto de los PDF
        default: "0"
      anadir:
        description: Añadir y guardar estos enlaces (url o url|Universidad, separados por espacios)
        default: ""
      urls:
        description: Probar solo estos enlaces (no guarda)
        default: ""
      reintentar:
        description: Volver a leer los documentos que no dieron resultados (si/no)
        default: "no"
      temporadas:
        description: Temporadas anteriores que se buscan en los calendarios
        default: "2"

permissions:
  contents: write

concurrency:
  group: ${{ inputs.urls && 'resultados-prueba' || 'datos-app' }}
  cancel-in-progress: false

jobs:
  resultados:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: sudo apt-get install -y -q poppler-utils >/dev/null
      - run: scripts/datos-rama.sh bajar
      - run: node scripts/build_resultados.mjs
        env:
          MAX_MIN: ${{ inputs.minutos || '40' }}
          DEBUG: ${{ inputs.debug || '0' }}
          FRESH: ${{ (inputs.guardar == 'no') && '1' || '' }}
          URLS: ${{ inputs.urls }}
          ANADIR: ${{ inputs.anadir }}
          RETRY_EMPTY: ${{ (inputs.reintentar == 'si') && '1' || '' }}
          SEASONS_BACK: ${{ inputs.temporadas || '2' }}
      - run: node scripts/auditar.mjs
      - run: node scripts/split_nadadores.mjs
      - run: node scripts/auditar.mjs despues
      - name: Guardar
        if: ${{ inputs.guardar != 'no' && inputs.urls == '' }}
        run: scripts/datos-rama.sh subir
