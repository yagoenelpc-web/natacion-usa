name: Nadadores de Wikipedia

on:
  schedule:
    - cron: "33 3 * * 3"
  workflow_dispatch:
    inputs:
      solo:
        description: "Probar solo con estas universidades (separadas por comas), sin guardar"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ${{ inputs.solo && 'wiki-prueba' || 'wiki' }}
  cancel-in-progress: false

jobs:
  wiki:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: scripts/datos-rama.sh bajar
      - run: node scripts/build_internacionales.mjs
        env:
          SOLO: ${{ inputs.solo }}
      - name: Guardar
        if: ${{ !inputs.solo }}
        # Solo guarda su propio fichero, así no pisa lo que guarden a la vez los otros procesos de datos.
        run: scripts/datos-rama.sh subir-uno web/data/internacionales.json
