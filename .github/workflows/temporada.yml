name: Competiciones y nadadores

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos-app
  cancel-in-progress: false

jobs:
  temporada:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/build_temporada.mjs
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/archivo.json web/data/ncaa.json web/data/nadadores.json
          git diff --cached --quiet || (git commit -m "Competiciones y nadadores actualizados" && git pull --rebase -q && git push)
