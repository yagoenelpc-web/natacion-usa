name: Competiciones y nadadores

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos-app
  cancel-in-progress: false

jobs:
  temporada:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: scripts/datos-rama.sh bajar
      - run: node scripts/fix_keys.mjs
      - run: node scripts/build_temporada.mjs
      - run: node scripts/split_nadadores.mjs
      - name: Guardar
        run: scripts/datos-rama.sh subir
