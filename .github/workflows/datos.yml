name: Datos de universidades

on:
  workflow_dispatch:
    inputs:
      rehacer:
        description: Volver a generar la lista desde Wikipedia antes de completarla
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: datos-app
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: scripts/datos-rama.sh bajar
      - if: ${{ inputs.rehacer }}
        run: node scripts/build_unis.mjs web/data/unis.json && python3 scripts/fix_unis.py web/data/unis.json
      - run: node scripts/enriquecer.mjs web/data/unis.json
      - name: Guardar
        run: scripts/datos-rama.sh subir
