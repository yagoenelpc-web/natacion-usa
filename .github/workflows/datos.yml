name: Datos de universidades

on:
  workflow_dispatch:

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - env:
          DATOS_LOG: "1"
        run: node scripts/build_unis.mjs unis.json
      - run: python3 scripts/fix_unis.py unis.json
